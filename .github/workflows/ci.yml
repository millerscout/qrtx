name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.22.x", "stable"]
        cgo: ["0", "1"]
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      # Go 1.22's internal linker omits LC_UUID, which macOS 26's dyld requires
      # ("missing LC_UUID load command", abort trap) for pure-Go binaries built
      # with cgo on. The system linker adds it.
      GOFLAGS: ${{ (matrix.os == 'macos-latest' && matrix.go == '1.22.x' && matrix.cgo == '1') && '-ldflags=-linkmode=external' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: example plan verifies
        run: go run ./cmd/qrtx change verify --change tic-tac-toe
        env:
          QRTX_REPO: examples/tic-tac-toe
